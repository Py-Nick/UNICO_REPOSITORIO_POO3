{% extends "base.html" %}
{% load static %}
{% block title %}Início{% endblock %}
{% block styles %}
<link rel="stylesheet" href="{% static 'css/home.css' %}">
{% endblock %}
{% block content %}
<div id="content">
    <div class="container">
            <div class="row">
                <input type="hidden" value="{{categoria.id}}" name="id">
                <h5 for="Categoria" class="col-md-2">Categoria</h5>
                <input value="{{categoria.Categoria}}" name="Categoria" disable>
            </div>
            <div class="row">
                <label for="criado_em" class="col-md-2">Criado em</label>
                <input value="{{categoria.criado_em}}" name="criado_em" disable >
            </div>
            <div class="row">
                <label for="alterado_em" class="col-md-2">Alterado em</label>
                <input value="{{categoria.alterado_em}}" name="alterado_em" disable >
            </div>
            <div class="row">
                <a href="{% url 'categoria' %}" class="btn bg-secondary col-md-2 mt-3"><i class="fa
                fa-rotate-left"></i> Retornar</a>
            </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{% static 'js/home.js' %}"></script>
{% endblock %}
