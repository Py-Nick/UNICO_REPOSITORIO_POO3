{% extends "base.html" %}
{% load static %}
{% block title %}Início{% endblock %}
{% block styles %}
<link rel="stylesheet" href="{% static 'css/home.css' %}">
{% endblock %}
{% block content %}
<div id="content">
    <div class="container">
        <form method="POST" action= "/categoria/create">
            {% csrf_token %}
            <div class="row">
                <!-- <input type="hidden" value="{{categoria.id}}" name="id"> -->
                <h5 for="Categoria" class="col-md-2">Categoria</h5>
                <input name="Categoria">
            </div>
            <div class="row">
                <button type="submit" class="btn btn-danger col-md-2 mt-3 mr-2"><i class="fafa-check"></i> Inserir</button>
                <a href="{% url 'categoria' %}" class="btn bg-secondary col-md-2 mt-3"><i class="fafa-rotate-left"></i> Retornar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
    <script src="{% static 'js/home.js' %}"></script>
{% endblock %}
